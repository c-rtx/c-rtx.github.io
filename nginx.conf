server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers (default when location has no add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # HTML / CSS / JS / Images: cached by browser but always revalidated via ETag
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg)$ {
        try_files $uri @redirect_photos;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Fonts: long-lived cache
    location ~* \.(woff|woff2|ttf|eot)$ {
        try_files $uri @redirect_photos;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Homepage: always revalidate so updated asset hashes/markup are picked up immediately
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files /index.html =404;
    }

    # If file or folder exists in static site, serve it; otherwise redirect to photos.radenkovic.com
    location / {
        try_files $uri $uri/ @redirect_photos;
    }

    # Fallback: Redirect all non-existent URLs (albums, /me, old photos, query params) to photos.radenkovic.com
    location @redirect_photos {
        return 301 https://photos.radenkovic.com$request_uri;
    }
}
