server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Static assets of the landing page (if file exists, serve with cache; otherwise redirect to photos)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        try_files $uri @redirect_photos;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Homepage
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    # If file or folder exists in static site, serve it; otherwise redirect to photos.radenkovic.com
    location / {
        try_files $uri $uri/ @redirect_photos;
    }

    # Fallback: Redirect all non-existent URLs (albums, /me, old photos, query params) to photos.radenkovic.com
    location @redirect_photos {
        return 301 https://photos.radenkovic.com$request_uri;
    }
}
